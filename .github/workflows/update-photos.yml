
name: Update Cougar Aquatics Slideshow

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "23 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "cougar-slideshow-pages"
  cancel-in-progress: false

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Read photos from GoMotion
        run: python update_photos.py

      - name: Verify photo list
        run: |
          python -c "import json; p=json.load(open('photos.json')); assert len(p)>0; print('Photos found:', len(p))"

      - name: Prepare website
        run: |
          mkdir -p site
          cp index.html site/
          cp photos.json site/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publish slideshow
        id: deployment
        uses: actions/deploy-pages@v4
