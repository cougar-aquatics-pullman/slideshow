
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Cougar Aquatics Slideshow</title>

<style>

/* ==========================================
   GENERAL
   ========================================== */

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  background: transparent;
  font-family: Arial, Helvetica, sans-serif;
}


/* ==========================================
   SLIDESHOW
   ========================================== */

.ca-slideshow {
  position: relative;

  width: 100%;
  max-width: 900px;
  aspect-ratio: 16 / 9;

  margin: 0 auto;

  overflow: hidden;
  border-radius: 8px;

  background: #20242a;
}


/* BLURRED BACKGROUND */

.ca-background {
  position: absolute;
  inset: -20px;

  background-size: cover;
  background-position: center;

  filter: blur(20px) brightness(.45);
}


/* PHOTOGRAPHS */

.ca-slide {
  position: absolute;
  inset: 0;

  width: 100%;
  height: 100%;

  object-fit: contain;

  opacity: 0;
  transition: opacity .8s ease;
}

.ca-slide.active {
  opacity: 1;
}


/* ==========================================
   CONTROLS
   ========================================== */

.ca-controls {
  position: absolute;

  bottom: 14px;
  left: 14px;
  right: 14px;

  display: flex;
  align-items: center;
  justify-content: space-between;

  gap: 12px;
  z-index: 5;
}

.ca-buttons {
  display: flex;
  gap: 8px;
}

.ca-controls button {
  width: 40px;
  height: 40px;

  border: 1px solid rgba(255,255,255,.3);
  border-radius: 50%;

  background: rgba(20,23,28,.75);

  color: white;
  font-size: 19px;

  cursor: pointer;
}

.ca-controls button:hover {
  background: #981e32;
}

.ca-controls button:focus-visible {
  outline: 2px solid white;
  outline-offset: 3px;
}

.ca-count {
  padding: 8px 13px;

  color: white;
  background: rgba(20,23,28,.65);

  border-radius: 20px;

  font-size: 12px;
  font-weight: 700;
}


/* ==========================================
   PHOTO SOURCE WARNING
   Only visible if automatic loading fails
   ========================================== */

.ca-warning {
  display: none;

  position: absolute;
  top: 12px;
  left: 12px;
  right: 12px;

  z-index: 6;

  padding: 9px 12px;

  color: #ffffff;
  background: rgba(100,30,50,.92);

  border-radius: 5px;

  font-size: 12px;
  line-height: 1.4;
}


/* ==========================================
   MOBILE
   ========================================== */

@media (max-width: 600px) {

  .ca-slideshow {
    aspect-ratio: 4 / 3;
    border-radius: 4px;
  }

  .ca-controls button {
    width: 36px;
    height: 36px;
  }

}

@media (prefers-reduced-motion: reduce) {

  .ca-slide {
    transition: none;
  }

}

</style>
</head>

<body>

<div class="ca-slideshow" id="slideshow">

  <div class="ca-background" id="background"></div>

  <img
    class="ca-slide active"
    id="slideA"
    alt="Cougar Aquatics swimming">

  <img
    class="ca-slide"
    id="slideB"
    alt="Cougar Aquatics swimming">

  <div class="ca-warning" id="warning">
    Photo Album could not be loaded.
    Showing backup photographs.
  </div>

  <div class="ca-controls">

    <div class="ca-buttons">

      <button
        id="previous"
        type="button"
        aria-label="Previous photo">
        &#10094;
      </button>

      <button
        id="playPause"
        type="button"
        aria-label="Pause slideshow">
        &#10074;&#10074;
      </button>

      <button
        id="next"
        type="button"
        aria-label="Next photo">
        &#10095;
      </button>

    </div>

    <span class="ca-count" id="counter">
      Loading...
    </span>

  </div>

</div>


<script>

/* ==========================================
   COUGAR AQUATICS AUTOMATIC SLIDESHOW

   Photo source:
   GoMotion Photo Album

   https://www.gomotionapp.com/team/waca/
   page/system/res/236105

   GitHub automatically generates photos.json.

   ADD / REMOVE / REORDER PHOTOS IN GOMOTION.
   DO NOT EDIT THIS FILE TO UPDATE PHOTOS.
   ========================================== */


/* ==========================================
   BACKUP PHOTOGRAPHS

   Used only if photos.json cannot be loaded.
   ========================================== */

const backupPhotos = [
  "https://www.gomotionapp.com/waca/UserFiles/Image/heros/team5_004088.png",
  "https://www.gomotionapp.com/waca/UserFiles/Image/heros/konstantina-hanna2_062985.jpg",
  "https://www.gomotionapp.com/waca/UserFiles/Image/heros/relay-team-1_02162b1.png"
];


/* ==========================================
   SETTINGS
   ========================================== */

const interval = 5000;

let photos = [];
let index = 0;

let playing = true;
let timer = null;

let showingA = true;
let transitionId = 0;

let ready = false;


/* ==========================================
   ELEMENTS
   ========================================== */

const slideshow =
  document.getElementById("slideshow");

const slideA =
  document.getElementById("slideA");

const slideB =
  document.getElementById("slideB");

const background =
  document.getElementById("background");

const counter =
  document.getElementById("counter");

const playPause =
  document.getElementById("playPause");

const warning =
  document.getElementById("warning");


/* ==========================================
   AUTOMATIC PHOTO LOADING
   ========================================== */

async function loadPhotos() {

  try {

    // Request a fresh published photo list.
    const url =
      "./photos.json?refresh=" + Date.now();

    const response = await fetch(url, {
      cache: "no-store"
    });

    if (!response.ok) {
      throw new Error(
        "Photo list HTTP " + response.status
      );
    }

    const data = await response.json();

    if (!Array.isArray(data) || data.length === 0) {
      throw new Error("Photo list is empty");
    }

    const validPhotos = data.filter(function (url) {
      return (
        typeof url === "string" &&
        url.startsWith("https://www.gomotionapp.com/")
      );
    });

    if (validPhotos.length === 0) {
      throw new Error("No valid photo URLs");
    }

    photos = [...new Set(validPhotos)];

    console.log(
      "Cougar Aquatics: loaded",
      photos.length,
      "photos from GoMotion."
    );

  } catch (error) {

    console.warn(
      "Photo Album unavailable:",
      error
    );

    photos = backupPhotos.slice();

    warning.style.display = "block";

  }

  initializeSlideshow();

}


/* ==========================================
   INITIALIZE SLIDESHOW
   ========================================== */

function initializeSlideshow() {

  if (!photos.length) {
    counter.textContent = "No photos";
    return;
  }

  index = 0;
  showingA = true;

  slideA.src = photos[0];
  slideA.classList.add("active");

  slideB.classList.remove("active");

  background.style.backgroundImage =
    'url("' + photos[0] + '")';

  ready = true;

  updateCounter();
  scheduleNext();

}


/* ==========================================
   COUNTER
   ========================================== */

function updateCounter() {

  counter.textContent =
    (index + 1) + " / " + photos.length;

}


/* ==========================================
   AUTOMATIC TIMER
   ========================================== */

function scheduleNext() {

  clearTimeout(timer);

  if (ready && playing && !document.hidden &&
      photos.length > 1) {

    timer = setTimeout(function () {
      changeSlide(1);
    }, interval);

  }

}


/* ==========================================
   CHANGE PHOTO
   ========================================== */

function changeSlide(direction) {

  if (!ready || photos.length < 2) return;

  clearTimeout(timer);

  const nextIndex =
    (index + direction + photos.length)
    % photos.length;

  const requestId = ++transitionId;

  const preload = new Image();

  preload.onload = function () {

    if (requestId !== transitionId) return;

    const incoming =
      showingA ? slideB : slideA;

    const outgoing =
      showingA ? slideA : slideB;

    incoming.src = photos[nextIndex];

    incoming.classList.remove("active");

    void incoming.offsetWidth;

    incoming.classList.add("active");

    outgoing.classList.remove("active");

    background.style.backgroundImage =
      'url("' + photos[nextIndex] + '")';

    showingA = !showingA;

    index = nextIndex;

    updateCounter();
    scheduleNext();

  };

  preload.onerror = function () {

    if (requestId === transitionId) {
      console.warn(
        "Could not load photo:",
        photos[nextIndex]
      );
      scheduleNext();
    }

  };

  preload.src = photos[nextIndex];

}


/* ==========================================
   PREVIOUS / NEXT
   ========================================== */

document.getElementById("next")
  .addEventListener("click", function () {
    changeSlide(1);
  });

document.getElementById("previous")
  .addEventListener("click", function () {
    changeSlide(-1);
  });


/* ==========================================
   PAUSE / PLAY
   ========================================== */

playPause.addEventListener("click", function () {

  playing = !playing;

  playPause.innerHTML = playing
    ? "&#10074;&#10074;"
    : "&#9654;";

  playPause.setAttribute(
    "aria-label",
    playing
      ? "Pause slideshow"
      : "Play slideshow"
  );

  scheduleNext();

});


/* ==========================================
   TAB VISIBILITY

   Never fast-forward to catch up.
   ========================================== */

document.addEventListener(
  "visibilitychange",
  function () {

    if (document.hidden) {
      clearTimeout(timer);
    } else {
      scheduleNext();
    }

  }
);


/* ==========================================
   MOBILE SWIPE
   ========================================== */

let touchStartX = 0;

slideshow.addEventListener(
  "touchstart",
  function (e) {

    touchStartX =
      e.changedTouches[0].screenX;

  },
  { passive: true }
);

slideshow.addEventListener(
  "touchend",
  function (e) {

    const difference =
      e.changedTouches[0].screenX
      - touchStartX;

    if (Math.abs(difference) > 50) {

      changeSlide(
        difference < 0 ? 1 : -1
      );

    }

  },
  { passive: true }
);


/* ==========================================
   START
   ========================================== */

loadPhotos();

</script>

</body>
</html>
