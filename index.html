
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Cougar Aquatics Slideshow</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  background: transparent;
  font-family: Arial, Helvetica, sans-serif;
}

.ca-slideshow {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 9;
  overflow: hidden;
  background: #20242a;
  border-radius: 8px;
}

/* Background fills the frame */

.ca-background {
  position: absolute;
  inset: -20px;
  background-size: cover;
  background-position: center;
  filter: blur(20px) brightness(.45);
}

/* Two layers create smooth transitions */

.ca-slide {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: contain;
  opacity: 0;
  transition: opacity .8s ease;
}

.ca-slide.active {
  opacity: 1;
}

/* Controls */

.ca-controls {
  position: absolute;
  bottom: 14px;
  left: 14px;
  right: 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  z-index: 5;
}

.ca-buttons {
  display: flex;
  gap: 8px;
}

.ca-controls button {
  width: 40px;
  height: 40px;
  border: 1px solid rgba(255,255,255,.3);
  border-radius: 50%;
  background: rgba(20,23,28,.75);
  color: white;
  font-size: 19px;
  cursor: pointer;
}

.ca-controls button:hover {
  background: #981e32;
}

.ca-count {
  color: white;
  background: rgba(20,23,28,.65);
  border-radius: 20px;
  padding: 8px 13px;
  font-size: 12px;
  font-weight: 700;
}

@media (max-width: 600px) {
  .ca-slideshow {
    aspect-ratio: 4 / 3;
    border-radius: 4px;
  }

  .ca-controls button {
    width: 36px;
    height: 36px;
  }
}

@media (prefers-reduced-motion: reduce) {
  .ca-slide {
    transition: none;
  }
}
</style>
</head>

<body>

<div class="ca-slideshow" id="slideshow">

  <div class="ca-background" id="background"></div>

  <img class="ca-slide active" id="slideA" alt="Cougar Aquatics swimming">
  <img class="ca-slide" id="slideB" alt="Cougar Aquatics swimming">

  <div class="ca-controls">
    <div class="ca-buttons">
      <button id="previous" aria-label="Previous photo">&#10094;</button>
      <button id="playPause" aria-label="Pause slideshow">&#10074;&#10074;</button>
      <button id="next" aria-label="Next photo">&#10095;</button>
    </div>

    <span class="ca-count" id="counter">1 / 3</span>
  </div>

</div>

<script>

/* =============================================
   PHOTO LIBRARY
   ADD NEW PHOTO URLS HERE
   ============================================= */

const photos = [
  "https://www.gomotionapp.com/waca/UserFiles/Image/heros/team5_004088.png",
  "https://www.gomotionapp.com/waca/UserFiles/Image/heros/konstantina-hanna2_062985.jpg",
  "https://www.gomotionapp.com/waca/UserFiles/Image/heros/relay-team-1_02162b1.png"
];

/* =============================================
   SLIDESHOW SETTINGS
   ============================================= */

const interval = 5000;
let index = 0;
let playing = true;
let timer = null;
let showingA = true;
let transitionId = 0;

const slideA = document.getElementById("slideA");
const slideB = document.getElementById("slideB");
const background = document.getElementById("background");
const counter = document.getElementById("counter");
const playPause = document.getElementById("playPause");

function updateCounter() {
  counter.textContent = (index + 1) + " / " + photos.length;
}

function scheduleNext() {
  clearTimeout(timer);

  if (playing && !document.hidden) {
    timer = setTimeout(() => changeSlide(1), interval);
  }
}

function changeSlide(direction) {
  clearTimeout(timer);

  const nextIndex =
    (index + direction + photos.length) % photos.length;

  const requestId = ++transitionId;
  const preload = new Image();

  preload.onload = function () {
    if (requestId !== transitionId) return;

    const incoming = showingA ? slideB : slideA;
    const outgoing = showingA ? slideA : slideB;

    incoming.src = photos[nextIndex];

    incoming.classList.remove("active");
    void incoming.offsetWidth;
    incoming.classList.add("active");

    outgoing.classList.remove("active");

    background.style.backgroundImage =
      'url("' + photos[nextIndex] + '")';

    showingA = !showingA;
    index = nextIndex;
    updateCounter();
    scheduleNext();
  };

  preload.onerror = function () {
    if (requestId === transitionId) {
      scheduleNext();
    }
  };

  preload.src = photos[nextIndex];
}

document.getElementById("next").onclick = function () {
  changeSlide(1);
};

document.getElementById("previous").onclick = function () {
  changeSlide(-1);
};

playPause.onclick = function () {
  playing = !playing;

  playPause.innerHTML = playing
    ? "&#10074;&#10074;"
    : "&#9654;";

  playPause.setAttribute(
    "aria-label",
    playing ? "Pause slideshow" : "Play slideshow"
  );

  scheduleNext();
};

/* No catch-up when returning to a tab */

document.addEventListener("visibilitychange", function () {
  if (document.hidden) {
    clearTimeout(timer);
  } else {
    scheduleNext();
  }
});

/* Swipe support */

let touchStartX = 0;

document.getElementById("slideshow")
  .addEventListener("touchstart", function (e) {
    touchStartX = e.changedTouches[0].screenX;
  }, {passive: true});

document.getElementById("slideshow")
  .addEventListener("touchend", function (e) {
    const difference =
      e.changedTouches[0].screenX - touchStartX;

    if (Math.abs(difference) > 50) {
      changeSlide(difference < 0 ? 1 : -1);
    }
  }, {passive: true});

/* Initialize */

slideA.src = photos[0];
background.style.backgroundImage =
  'url("' + photos[0] + '")';

updateCounter();
scheduleNext();

</script>

</body>
</html>
